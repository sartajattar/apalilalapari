{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 shadow-sm border-0 rounded-4">
            <h4 class="fw-bold text-center mb-3">नागरिक लॉगिन</h4>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">मोबाईल नंबर किंवा ईमेल</label>
                    <input type="text" name="identifier" class="form-control" required placeholder="९८XXXXXXXX / email@domain.com">
                </div>
                <div class="mb-3">
                    <label class="form-label">पासवर्ड</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-danger w-100 fw-bold">लॉगिन करा</button>
            </form>
            <p class="text-center mt-3 small">नवीन आहात? <a href="{{ url_for('register') }}">येथे मोफत नोंदणी करा</a></p>
        </div>
    </div>
</div>
{% endblock %}
