{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card p-4 shadow-sm border-0 rounded-4 border-top border-danger border-4">
            <h4 class="fw-bold text-center mb-3 text-danger"><i class="bi bi-shield-lock"></i> ॲडमिन पॅनल</h4>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">ॲडमिन युझरनेम</label>
                    <input type="text" name="identifier" class="form-control" required placeholder="युझरनेम प्रविष्ट करा">
                </div>
                <div class="mb-3">
                    <label class="form-label">पासवर्ड</label>
                    <input type="password" name="password" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-dark w-100 fw-bold">ॲडमिन लॉगिन</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
